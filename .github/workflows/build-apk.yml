name: Gerar APK Black Oath

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Localizar e extrair projeto
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo 'ERRO: envie o ZIP preparado do Black Oath para a raiz do repositório.'
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name package.json -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo 'ERRO: package.json não encontrado dentro do ZIP.'
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Instalar dependências
        run: npm install
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Compilar jogo
        run: npm run build
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Criar projeto Android
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar APK instalável
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          cp "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk" Black-Oath-v0.2.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Oath-v0.2-APK
          path: Black-Oath-v0.2.apk
          if-no-files-found: error
