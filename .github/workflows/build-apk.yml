name: Gerar APK Black Oath v0.3

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'v0.3/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar cenários da v0.3
        shell: bash
        run: |
          set -e
          if [ ! -f black-oath-v0.2-android-ready.zip ]; then
            echo 'ERRO: o pacote v0.2 usado como banco dos cenários não foi encontrado.'
            exit 1
          fi
          rm -rf legacy-assets
          mkdir -p legacy-assets
          unzip -q black-oath-v0.2-android-ready.zip -d legacy-assets
          ENV_FILE=$(find legacy-assets -type f -name 'floresta-azul.png' | head -n 1)
          if [ -z "$ENV_FILE" ]; then
            echo 'ERRO: os cenários não foram encontrados dentro do pacote v0.2.'
            exit 1
          fi
          ENV_DIR=$(dirname "$ENV_FILE")
          mkdir -p v0.3/assets/environment
          cp "$ENV_DIR"/*.png v0.3/assets/environment/
          echo "Cenários copiados de $ENV_DIR"

      - name: Instalar dependências
        run: npm install
        working-directory: v0.3

      - name: Montar versão web
        run: npm run build
        working-directory: v0.3

      - name: Criar projeto Android
        shell: bash
        working-directory: v0.3
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar APK instalável
        shell: bash
        working-directory: v0.3/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Preparar APK
        shell: bash
        run: |
          cp v0.3/android/app/build/outputs/apk/debug/app-debug.apk Black-Oath-v0.3.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Oath-v0.3-APK
          path: Black-Oath-v0.3.apk
          if-no-files-found: error
